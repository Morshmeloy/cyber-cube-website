<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#050510"/>
  <g filter="url(#glow)" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <!-- Куб -->
    <polygon points="32,12 52,24 52,44 32,56 12,44 12,24" stroke="#0ff" fill="rgba(0,255,255,0.08)"/>
    <line x1="32" y1="12" x2="32" y2="56" stroke="#0ff" opacity="0.4"/>
    <line x1="12" y1="24" x2="52" y2="44" stroke="#0ff" opacity="0.3"/>
    <line x1="52" y1="24" x2="12" y2="44" stroke="#0ff" opacity="0.3"/>
    <!-- Молния -->
    <polyline points="38,8 34,22 40,24 30,40" stroke="#f0f" stroke-width="1.8" opacity="0.9"/>
    <polyline points="24,18 28,26 22,28 30,38" stroke="#0ff" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Д4 -->
  <text x="32" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#0ff" opacity="0.9">Д4</text>
</svg>
